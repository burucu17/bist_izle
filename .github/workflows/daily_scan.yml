name: BIST Daily Scan

# Her hafta içi 18:30 TSI = 15:30 UTC'te otomatik tarar ve Telegram'a sinyal gönderir.
# Manuel çalıştırmak için: Actions sekmesi > BIST Daily Scan > Run workflow
on:
  schedule:
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır (Telegram'a gönder)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets. TELEGRAM_CHAT_ID }}
        run: python run_scan.py
