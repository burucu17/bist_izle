# =====================================================================
# BIST Weighted Strategy - Yapılandırma Dosyası
# Orijinal: AlbertoCuadra/algo_trading_weighted_strategy (Pine Script)
# Uyarlama: BIST hisseleri, günlük (1d) zaman dilimi, Telegram bildirimi
# =====================================================================

# --- Telegram ---------------------------------------------------------
# Token ve chat_id'yi .env dosyasına koyman önerilir (config'e de yazabilirsin).
# .env yoksa buradaki değerler kullanılır (boş bırakma).
telegram:
  bot_token: ""          # @BotFather'dan aldığın token, ör: 123456:ABC-DEF...
  chat_id: ""            # Bildirim gelecek sohbet/kanal ID'si
  enabled: true         # false yaparsan sadece konsola yazar

# --- Zaman dilimi & veri ----------------------------------------------
timeframe:
  interval: "1d"        # 1d = günlük (BIST için önerilen)
  period: "2y"          # Yeterli geçmiş için (en uzun MA 82 periyot + tampon)

# --- İzlenecek hisseler (ÖZEL LİSTEN) ----------------------------------
# Yahoo Finance için MUTLAKA ".IS" soneki kullan:
#   THYAO.IS, GARAN.IS, ASELS.IS, KCHOL.IS, SISE.IS ...
# Buraya kendi hisselerini yaz. Boş bırakırsan BIST30'a düşer.
watchlist:
  - THYAO.IS
  - GARAN.IS
  - ASELS.IS
  - KCHOL.IS
  - SISE.IS
  - EREGL.IS
  - TUPRS.IS
  - BIMAS.IS
  # Yukarıdakiler ÖRNEK'tir. Kendi listene göre değiştir.

# Otomatik BIST30 listesini kullanmak istersen watchlist'i boş bırak
# ve asagidaki flag'i true yap.
use_bist30_if_empty: true

# --- Ağırlıklı strateji ayarları --------------------------------------
# Her göstergeye 0-5 arası ağırlık ver. Skor = aktif göstergelerin
# (sinyal üretenlerin) ağırlık toplamı. Skor >= weight_trigger ise sinyal.
strategy:
  weight_trigger: 2      # Eşik (0-5). Varsayılan 2 = 5 göstergeden en az 2'si uymalı.
  allow_longs: true
  allow_shorts: true

  # Göstergeleri aç/kapa ve ağırlık ver
  macd:        { enabled: true,  weight: 1 }
  stoch_rsi:   { enabled: true,  weight: 1 }
  rsi:         { enabled: true,  weight: 1 }
  supertrend:  { enabled: true,  weight: 1 }
  ma_cross:    { enabled: true,  weight: 1 }

  # --- MACD (orijinal: EMA16 hl2 - EMA36 high, sinyal SMA9) ---
  macd_params:
    fast_period: 16
    fast_source: hl2     # hl2 | close | open | high | low
    slow_period: 36
    slow_source: high    # hl2 | close | open | high | low
    signal_period: 9
    signal_type: SMA     # SMA

  # --- Stochastic RSI ---
  stoch_rsi_params:
    rsi_length: 14
    stoch_length: 14
    smooth_k: 3
    overbought: 70       # k bu seviyenin ustune cikarsa asiri alim (short sinyali)
    oversold: 27         # k bu seviyenin altina inerse asiri satim (long sinyali)

  # --- RSI ---
  rsi_params:
    length: 14
    overbought: 77       # asiri alim (short)
    oversold: 30         # asiri satim (long)

  # --- Supertrend ---
  supertrend_params:
    atr_period: 2
    multiplier: 2.4
    source: hl2          # hl2 | close

  # --- MA Cross ---
  ma_cross_params:
    fast_period: 46
    fast_type: EMA       # EMA | SMA
    fast_source: close
    slow_period: 82
    slow_type: EMA       # EMA | SMA
    slow_source: close

# --- Risk yönetimi (bilgi amaçlı SL/TP hesapları) ---------------------
# Bu sistem sadece SİNYAL üretir, emir göndermez.
# Değerler sadece Telegram mesajında "referans" olarak gösterilir.
risk:
  stoploss_pct: 6.0      # %6
  take_profit_pct: 6.8   # her TP adımı %6.8
  max_tp: 6              # maksimum TP sayısı

# --- Çalıştırma -------------------------------------------------------
run:
  dry_run: false         # true -> Telegram'a göndermez, sadece konsola yazar
  loop_minutes: 0        # 0 -> tek tarama. >0 -> belirli aralıkla tekrarla (cron önerilir)
