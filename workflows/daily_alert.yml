name: BIST Gunluk Sinyal (GitHub Actions)

# Ucretsiz: bilgisayariniz acik olmasa bile her gun sinyal ozetini Telegram'a gonderir.
# weighted_ensemble stratejisini kullanir (bot.py --digest).
# Interaktif sohbet (/sinyal) ozelligi icin bir bulut sunucuya deploy gerekir (bkz. DEPLOY.md).

on:
  schedule:
    # Turkiye surekli UTC+3 (2016'dan beri yaz saati uygulanmiyor).
    # 18:15 Istanbul = 15:15 UTC. GitHub UTC kullanir.
    # Not: Actions cron'u bazi gunler 5-15 dk gecikmeli calisabilir, normaldir.
    - cron: "15 15 * * 1-5"
  workflow_dispatch:  # manuel calistirmak icin Actions sekmesinden "Run workflow"

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: izle_config.json olustur (token gizli degisken)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, json
          cfg = {
              "telegram_bot_token": os.environ.get("TG_TOKEN", ""),
              "telegram_chat_id": os.environ.get("TG_CHAT", ""),
              "timeframe": "1d",
              "session": "regular",
              "start": "2020-01-01",
              "bot_strateji": "weighted",
              "gunluk_saat": "18:15"
          }
          with open("izle_config.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          print("config yazildi (token uzunlugu:", len(cfg["telegram_bot_token"]), ")")
          PY

      - name: Gunluk sinyalleri Telegram'a gonder (weighted_ensemble)
        run: python bot.py --digest
